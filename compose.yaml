# Local services. Start them with `bun db:up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acme_corp
      POSTGRES_PASSWORD: acme_corp
      POSTGRES_DB: acme_corp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_corp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
