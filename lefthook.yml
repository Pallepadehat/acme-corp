# Fast and staged-only: Biome fixes formatting and imports before the commit.
# CI (`bun run check`) is the real gate.
pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
